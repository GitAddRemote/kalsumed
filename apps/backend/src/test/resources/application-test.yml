spring:
  datasource:
    url: jdbc:h2:mem:testdb
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
    show-sql: false

  data:
    redis:
      host: localhost
      port: 6379

app:
  jwt:
    secret: test-secret-key-for-jwt-tokens-must-be-at-least-256-bits-long-12345
    ttlSeconds: 3600

logging:
  level:
    com.presstronic.kalsumed: DEBUG
    org.springframework.security: DEBUG
